<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación - Evento Especial</title>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: linear-gradient(to bottom, #fdfcfb, #e2d1c3);
      color: #4a4a4a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      padding: 30px;
    }

    .image {
      flex: 1;
      text-align: center;
    }

    .image img {
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
    }

    .content {
      flex: 2;
      text-align: center;
      padding-left: 20px;
    }

    h1 {
      font-size: 2.5em;
      color: #b38b59;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5em;
      color: #7a5c3a;
      margin-top: 0;
    }

    p {
      font-size: 1.1em;
      margin: 10px 0;
    }

    .button {
      display: inline-block;
      background-color: #b38b59;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #7a7a7a;
    }

    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }
      .image img {
        max-width: 250px;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="lyricstash01-36640234331639062.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="image">
      <img src="Copilot_20260907_001126.png" alt="Decoración floral">
    </div>
    <div class="content">
      <h2>Nos Casamos</h2>
      <h1>Julio & Katherine</h1>
      <p>Con gran alegría queremos compartir este momento especial contigo.</p>
      <p><strong>Fecha:</strong> 20 de Octubre, 2026</p>
      <p><strong>Lugar:</strong> Jardines del Hotel Sucre</p>
      <p>Esperamos contar con tu presencia.</p>
      <a href="#" class="button">Confirmar Asistencia</a>
      <div class="footer">
        <p>Invitación para: Invitado Especial</p>
        <p>Invitados: 2 | Código: XX001</p>
      </div>
    </div>
  </div>
</body>
</html>
