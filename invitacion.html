<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación - Evento Especial</title>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: linear-gradient(to bottom, #fdfcfb, #e2d1c3);
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      font-size: 2.5em;
      color: #b38b59;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 1.5em;
      color: #7a5c3a;
      margin-top: 0;
    }
    p {
      font-size: 1.1em;
      margin: 10px 0;
    }
    .button {
      display: inline-block;
      background-color: #b38b59;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #7a7a7a;
    }
  </style>
</head>
<body>
  <div class="container">

    <p><strong>Fecha:</strong> 20 de Octubre, 2026</p>
    <p><strong>Lugar:</strong> Calle Tomas Frias #60</p>
    <p>Esperamos contar con tu presencia.</p>
    <a href="#" class="button">Confirmar Asistencia</a>
    <div class="footer">

    </div>
  </div>
</body>
</html>
