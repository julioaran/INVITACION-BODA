<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julio & Katherin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      font-family: 'Playfair Display', serif;
      background: url('Copilot_20260906_233626.png') no-repeat center center;
      background-size: cover; /* ocupa todo el alto y ancho */
      overflow: hidden;
      animation: fadeIn 2s ease-in forwards;
    }

    .button {
      margin-bottom: 5vh;
      background-color: #000;
      color: white;
      padding: 20px 60px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 1.4em;
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.3s, background 0.3s;
      animation: fadeInButton 2.5s ease-out;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .button:hover {
      background-color: #222;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInButton {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ajuste para pantallas pequeñas */
    @media (max-width: 600px) {
      .button {
        font-size: 1.1em;
        padding: 15px 40px;
        margin-bottom: 8vh;
      }
    }
  </style>
</head>
<body>
  <a href="invitacion.html" class="button">Ver Invitación</a>
</body>
</html>
