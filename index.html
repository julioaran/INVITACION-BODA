<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julio & Katherin</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-color: #fff;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
      animation: fadeIn 2s ease-in forwards;
      background-image: url('Copilot_20260906_224833.png'); /* usa el nombre exacto del archivo */
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .button {
      margin-bottom: 60px;
      background-color: #000; /* color negro */
      color: white;
      padding: 20px 50px; /* más grande */
      border-radius: 40px;
      text-decoration: none;
      font-size: 1.4em; /* texto más grande */
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.3s, background 0.3s;
      animation: fadeInButton 2.5s ease-out;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .button:hover {
      background-color: #222;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInButton {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <a href="invitacion.html" class="button">Ver Invitación</a>
</body>
</html>
